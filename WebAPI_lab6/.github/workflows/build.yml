name: GreenhouseMonitoring.Api CI/CD

on:
  push:
    branches: [ lab6 ]
  pull_request:
    branches: [ lab6 ]

env:
  DOTNET_VERSION: '8.0.x'

jobs:
  build-and-test:
    name: build-and-test-${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET Core
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Install dependencies
        run: dotnet restore GreenhouseMonitoring.Api/GreenhouseMonitoring.Api.csproj

      - name: Build
        run: dotnet build GreenhouseMonitoring.Api/GreenhouseMonitoring.Api.csproj --configuration Release --no-restore

      - name: Test
        run: dotnet test GreenhouseMonitoring.Api/GreenhouseMonitoring.Api.csproj --no-build --configuration Release --verbosity normal

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.os }}
          path: '**/TestResults/'